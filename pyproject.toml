[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dut-swe-engine"
version = "0.1.0"
description = "Displacement shallow-water engine with NumPy and CUDA backends"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "KeqiYe"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["shallow-water", "finite-element", "cuda", "simulation"]

[project.urls]
Repository = "https://github.com/KeqiYe/dut-swe-engine"
Issues = "https://github.com/KeqiYe/dut-swe-engine/issues"

[project.optional-dependencies]
cuda = ["warp-lang==1.17.0"]
desktop = ["pyvista>=0.46,<0.50"]
web = ["viser>=1.0,<2"]
dev = ["pytest>=8", "scipy>=1.12", "warp-lang==1.17.0"]

[project.scripts]
swe = "swe.cli:main"

[tool.setuptools.package-data]
swe = ["data/*.npz", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires an NVIDIA CUDA device", "slow: longer scientific validation"]
